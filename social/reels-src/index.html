<!doctype html>
<html
  lang="it"
  data-composition-variables='[
    {"id":"quote","type":"string","label":"Citazione","default":"Il preventivo B è di mio cognato. Se lo dico gli altri capiscono e mi tolgono la presidenza."},
    {"id":"emphasis","type":"string","label":"Parole in evidenza (separate da virgola)","default":"cognato"},
    {"id":"who","type":"string","label":"Attribuzione","default":"Il Bug della Trasparenza · Puntata 1"},
    {"id":"title","type":"string","label":"Titolo del libro","default":"Il Bug della Trasparenza"},
    {"id":"genre","type":"string","label":"Genere","default":"Noir sociale · 8 puntate"},
    {"id":"cover","type":"string","label":"Copertina","default":"assets/img/cover-bug.jpg"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Oswald"; font-weight: 700; src: url("assets/fonts/Oswald-700.woff2") format("woff2"); }
      @font-face { font-family: "Oswald"; font-weight: 500; src: url("assets/fonts/Oswald-500.woff2") format("woff2"); }
      @font-face { font-family: "Source Serif 4"; font-weight: 400; font-style: normal; src: url("assets/fonts/SourceSerif4-400.woff2") format("woff2"); }
      @font-face { font-family: "Source Serif 4"; font-weight: 400; font-style: italic; src: url("assets/fonts/SourceSerif4-400i.woff2") format("woff2"); }
      @font-face { font-family: "Source Serif 4"; font-weight: 600; font-style: normal; src: url("assets/fonts/SourceSerif4-600.woff2") format("woff2"); }

      :root { --bg: #0a0f18; --panel: #111a28; --ink: #eef1f5; --muted: #a7b2c2; --line: #22324a; --accent: #f0a24a; --accent-ink: #1a1206; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: "Source Serif 4", Georgia, serif; }

      #scene { position: absolute; inset: 0; }
      #glow { position: absolute; left: 50%; top: 22%; width: 1500px; height: 1500px; margin-left: -750px; margin-top: -750px; border-radius: 50%;
              background: radial-gradient(circle, rgba(240,162,74,.30) 0%, rgba(120,72,24,.16) 38%, rgba(10,15,24,0) 68%); }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(10,15,24,0) 40%, rgba(5,8,14,.72) 100%); }

      #brand { position: absolute; left: 90px; top: 290px; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 46px; letter-spacing: .28em; text-transform: uppercase; }
      #brand span { color: var(--accent); }
      #brand-rule { position: absolute; left: 90px; top: 366px; width: 96px; height: 6px; background: var(--accent); transform-origin: left center; }

      #qmark { position: absolute; left: 82px; top: 440px; font-family: "Source Serif 4", serif; font-style: italic; font-size: 240px; line-height: 1; color: var(--accent); opacity: .9; }
      #quote-wrap { position: absolute; left: 90px; right: 90px; top: 730px; height: 640px; display: flex; flex-direction: column; justify-content: center; }
      #quote { display: flex; flex-wrap: wrap; column-gap: .28em; row-gap: .12em; font-style: italic; font-weight: 400; line-height: 1.18; color: var(--ink); }
      #quote .w { display: inline-block; will-change: transform, opacity, filter; }
      #quote .w.em { color: var(--accent); }
      #who { margin-top: 56px; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 32px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
      #who::before { content: ""; display: inline-block; width: 56px; height: 3px; background: var(--accent); vertical-align: middle; margin-right: 22px; }

      #reveal { position: absolute; inset: 0; }
      #cover-wrap { position: absolute; left: 50%; top: 450px; width: 440px; height: 656px; margin-left: -220px; }
      #cover { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 2px var(--line), 0 0 160px rgba(240,162,74,.22); }
      #genre { position: absolute; left: 90px; right: 90px; top: 1150px; text-align: center; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
      #title { position: absolute; left: 90px; right: 90px; top: 1204px; text-align: center; font-family: "Oswald", sans-serif; font-weight: 700; font-size: 74px; line-height: 1.08; text-transform: uppercase; }
      #cta { position: absolute; left: 90px; right: 90px; top: 1380px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
      #pill { white-space: nowrap; padding: 30px 56px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: "Oswald", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 18px 60px rgba(240,162,74,.35); }
      #url { font-family: "Source Serif 4", serif; font-size: 36px; color: var(--muted); }
      #url b { color: var(--ink); font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <audio id="bed" src="assets/audio/bed.mp3" data-start="0" data-duration="13" data-track-index="10" data-volume="0.7"></audio>
      <section id="scene">
        <div id="glow"></div>
        <div id="vignette"></div>
        <div id="brand">D<span>.</span> IASIO</div>
        <div id="brand-rule"></div>

        <div id="qmark">“</div>
        <div id="quote-wrap">
          <div id="quote"></div>
          <div id="who" data-var-text="who">Il Bug della Trasparenza · Puntata 1</div>
        </div>

        <div id="reveal">
          <div id="cover-wrap"><img id="cover" data-var-src="cover" src="assets/img/cover-bug.jpg" alt="" /></div>
          <div id="genre" data-var-text="genre">Noir sociale · 8 puntate</div>
          <div id="title" data-var-text="title">Il Bug della Trasparenza</div>
          <div id="cta">
            <div id="pill">Leggi la Puntata 1 gratis</div>
            <div id="url">PDF ed EPUB · <b>libri.diasio.ch</b></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const V = window.__hyperframes.getVariables();
      const quote = String(V.quote || "");
      const emph = String(V.emphasis || "").toLowerCase().split(",").map((s) => s.trim()).filter(Boolean);
      const norm = (s) => s.toLowerCase().replace(/[^a-zàèéìòù’']/gi, "");
      const size = quote.length > 120 ? 66 : quote.length > 80 ? 74 : quote.length > 45 ? 86 : 104;
      const qEl = document.getElementById("quote");
      qEl.style.fontSize = size + "px";
      const words = quote.split(/\s+/).filter(Boolean);
      words.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w" + (emph.some((e) => e.split(/\s+/).includes(norm(w)) || e === norm(w)) ? " em" : "");
        s.textContent = w;
        qEl.appendChild(s);
      });

      const tl = gsap.timeline({ paused: true });
      // Apertura: brand, riga, alone
      tl.fromTo("#glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 2.4, ease: "power2.out" }, 0);
      tl.to("#glow", { scale: 1.12, duration: 10.6, ease: "sine.inOut" }, 2.4);
      tl.fromTo("#brand", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.fromTo("#brand-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.fromTo("#qmark", { opacity: 0, y: 30, scale: 0.85 }, { opacity: 0.9, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 0.55);

      // Citazione parola per parola
      const start = 0.9;
      const step = Math.min(0.17, 3.2 / Math.max(words.length, 1));
      const ws = document.querySelectorAll("#quote .w");
      ws.forEach((el, i) => {
        const t = start + i * step;
        tl.fromTo(el, { opacity: 0, y: 46, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, t);
        if (el.classList.contains("em")) {
          tl.fromTo(el, { textShadow: "0 0 0px rgba(240,162,74,0)" }, { textShadow: "0 0 34px rgba(240,162,74,.75)", duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.35);
        }
      });
      const qEnd = start + (ws.length - 1) * step + 0.55;
      tl.fromTo("#who", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, qEnd + 0.25);

      // Uscita citazione
      const exitAt = Math.max(qEnd + 2.2, 7.3);
      tl.to("#quote-wrap", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.6, ease: "power2.in" }, exitAt);
      tl.to("#qmark", { opacity: 0, y: -60, duration: 0.5, ease: "power2.in" }, exitAt);

      // Copertina, titolo, invito
      const rv = exitAt + 0.45;
      tl.fromTo("#cover-wrap", { opacity: 0, y: 220, rotationX: 28, scale: 0.86, transformPerspective: 1100 },
                { opacity: 1, y: 0, rotationX: 0, scale: 1, duration: 1.0, ease: "power4.out" }, rv);
      tl.to("#cover-wrap", { y: -14, duration: 3.2, ease: "sine.inOut" }, rv + 1.0);
      tl.fromTo("#genre", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, rv + 0.6);
      tl.fromTo("#title", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, rv + 0.8);
      tl.fromTo("#cta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, rv + 1.3);
      tl.fromTo("#pill", { scale: 1 }, { scale: 1.05, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3 }, rv + 2.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
